# configs/distillation.yaml
# Configuración para destilación de conocimiento MiniCPM → LLARRI

# ============================================
# CONFIGURACIÓN DEL TEACHER (MiniCPM-V)
# ============================================
teacher:
  model_name: "openbmb/MiniCPM-V-2_6"
  
  # Cuantización para GPUs pequeñas
  # 4-bit: ~4GB VRAM
  # 8-bit: ~8GB VRAM
  # none: ~16GB VRAM
  quantization: 4  # bits, o null para sin cuantización
  
  # Si tenés MiniCPM en otro servidor
  use_remote: false
  remote_url: ""
  
  # Prompts para el teacher
  transcription_prompt: "Transcribe exactamente el texto manuscrito en esta imagen. Solo responde con el texto, sin explicaciones."
  verification_prompt: "Verifica si esta transcripción es correcta: '{text}'. Si es correcta responde CORRECTO, si no responde con la corrección."
  
  # Verificación de predicciones (mejora calidad pero más lento)
  verify_predictions: true
  min_confidence_threshold: 0.5

# ============================================
# CONFIGURACIÓN DE DESTILACIÓN
# ============================================
distillation:
  # Pesos de pérdidas
  # alpha_hard: peso de CrossEntropy con ground truth
  # alpha_soft: peso de KL divergence con teacher
  # Nota: alpha_hard + alpha_soft deberían sumar 1.0
  alpha_hard: 0.3
  alpha_soft: 0.7
  
  # Temperatura para softmax
  # T > 1: distribuciones más suaves, student aprende más de probabilidades
  # T = 1: distribuciones normales
  # Recomendado: 2.0 - 4.0 para destilación
  temperature: 2.0
  
  # Curriculum learning
  # Empieza con samples fáciles (alta confianza) y progresa a difíciles
  use_curriculum: true
  curriculum_stages: 5
  initial_percentile: 0.3  # Empezar con 30% más fáciles
  
  # Ponderación por confianza
  use_weighted_sampling: true
  confidence_weight_scale: 2.0  # Samples con alta confianza pesan 2x más

# ============================================
# CONFIGURACIÓN DE ENTRENAMIENTO
# ============================================
training:
  # Hiperparámetros básicos
  learning_rate: 1.0e-5
  weight_decay: 0.01
  batch_size: 4  # Ajustar según VRAM
  max_epochs: 10
  
  # Warmup
  warmup_steps: 500
  
  # Gradient
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  # Effective batch size = 4 * 4 = 16
  
  # Mixed precision (recomendado para GPUs modernas)
  use_amp: true
  
  # Early stopping
  patience: 3
  min_delta: 0.001

# ============================================
# CONFIGURACIÓN DE DATOS
# ============================================
data:
  # Paths
  images_dir: "data/processed/lines"
  distilled_file: "data/distilled/distilled_dataset.jsonl"
  ground_truth_file: null  # Opcional
  
  # Splits
  val_split: 0.1
  
  # Dataloader
  num_workers: 4
  pin_memory: true
  
  # Filtros
  min_confidence: 0.3  # Filtrar samples con confianza < 0.3
  max_length: 256  # Longitud máxima de secuencia

# ============================================
# CONFIGURACIÓN DE CHECKPOINTS
# ============================================
checkpoints:
  dir: "checkpoints/distillation"
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"
  
  # Nombre del archivo
  filename: "llarri-distilled-{epoch}-{val_loss:.4f}"

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging:
  # Weights & Biases (opcional)
  use_wandb: false
  wandb_project: "llarri-distillation"
  wandb_entity: null
  
  # TensorBoard
  use_tensorboard: true
  tensorboard_dir: "logs/distillation"
  
  # Log frequency
  log_every_n_steps: 10

# ============================================
# DESTILACIÓN PROGRESIVA (OPCIONAL)
# ============================================
progressive_distillation:
  enabled: true
  stages:
    # Etapa 1: Solo soft labels
    - name: "soft_only"
      alpha_hard: 0.0
      alpha_soft: 1.0
      temperature: 3.0
      learning_rate: 5.0e-5
      max_epochs: 3
    
    # Etapa 2: Mixto (preferencia soft)
    - name: "mixed_soft_heavy"
      alpha_hard: 0.3
      alpha_soft: 0.7
      temperature: 2.0
      learning_rate: 2.0e-5
      max_epochs: 5
    
    # Etapa 3: Balanceado
    - name: "balanced"
      alpha_hard: 0.5
      alpha_soft: 0.5
      temperature: 1.5
      learning_rate: 1.0e-5
      max_epochs: 5

# ============================================
# RECURSOS DE GPU
# ============================================
resources:
  # Para GTX 1650 (4GB VRAM)
  # Estas configuraciones deberían funcionar
  
  # Fase 1: Generación de dataset (usa MiniCPM)
  # - Necesita ~4GB con cuantización 4-bit
  # - O usar servidor remoto
  
  # Fase 2: Entrenamiento (solo LLARRI)
  # - Batch size 4 debería funcionar
  # - Si hay OOM, reducir a 2 y aumentar accumulate_grad_batches
  
  # Tips para optimizar VRAM:
  # 1. Usar gradient checkpointing
  # 2. Usar mixed precision (AMP)
  # 3. Reducir batch size y aumentar accumulation
  # 4. Congelar encoder y solo entrenar decoder
  
  gradient_checkpointing: true
  freeze_encoder: false  # Poner true para ahorrar VRAM
