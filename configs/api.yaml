# =============================================================================
# Configuración de la API llarri-01
# =============================================================================
# Este archivo configura la API REST para OCR
# Copiar a configs/api.yaml y modificar según necesidades

# -----------------------------------------------------------------------------
# Servidor
# -----------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1  # Aumentar en producción con múltiples GPUs
  debug: false
  reload: false  # Solo para desarrollo

# -----------------------------------------------------------------------------
# Modelos
# -----------------------------------------------------------------------------
models:
  # Modelo base (requerido)
  base_model:
    path: "outputs/base_model/best.ckpt"
    device: "auto"  # auto, cuda, cpu
    
  # Selector de estilo (opcional)
  selector:
    path: "outputs/selector/best.ckpt"
    enabled: true
    
  # Expertos (opcional)
  experts:
    es_mayores:
      path: "outputs/experts/es_mayores/best.ckpt"
      enabled: true
    latam_jovenes:
      path: "outputs/experts/latam_jovenes/best.ckpt"
      enabled: true

  # Ensemble
  ensemble:
    enabled: true
    confidence_threshold: 0.7  # Umbral para usar experto vs base
    class_to_expert:
      0: "es_mayores"
      1: "latam_jovenes"
      2: "base"

# -----------------------------------------------------------------------------
# Inferencia
# -----------------------------------------------------------------------------
inference:
  # Parámetros por defecto
  default_max_length: 128
  default_num_beams: 4
  
  # Batch processing
  max_batch_size: 32
  batch_timeout_seconds: 30
  
  # Caché (experimental)
  cache_enabled: false
  cache_max_size: 1000
  cache_ttl_seconds: 3600

# -----------------------------------------------------------------------------
# Imágenes
# -----------------------------------------------------------------------------
images:
  # Formatos soportados
  supported_formats:
    - "png"
    - "jpg"
    - "jpeg"
    - "webp"
    - "bmp"
    - "tiff"
  
  # Límites
  max_size_mb: 10
  max_width: 4096
  max_height: 4096
  
  # Preprocesamiento
  resize_to: [224, 224]  # Tamaño del modelo
  normalize: true

# -----------------------------------------------------------------------------
# Rate Limiting
# -----------------------------------------------------------------------------
rate_limiting:
  enabled: false
  requests_per_minute: 60
  requests_per_hour: 1000
  burst_size: 10

# -----------------------------------------------------------------------------
# Seguridad
# -----------------------------------------------------------------------------
security:
  # CORS
  cors:
    enabled: true
    allow_origins:
      - "*"  # En producción, especificar dominios
    allow_methods:
      - "GET"
      - "POST"
    allow_headers:
      - "*"
  
  # API Keys (opcional)
  api_keys:
    enabled: false
    keys: []  # Lista de API keys válidas
  
  # HTTPS
  ssl:
    enabled: false
    cert_file: ""
    key_file: ""

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Archivos de log
  file:
    enabled: false
    path: "logs/api.log"
    max_size_mb: 100
    backup_count: 5
  
  # Métricas de requests
  log_requests: true
  log_responses: false  # Cuidado: puede ser mucho log

# -----------------------------------------------------------------------------
# Métricas y Monitoreo
# -----------------------------------------------------------------------------
metrics:
  enabled: true
  
  # Prometheus (opcional)
  prometheus:
    enabled: false
    port: 9090
  
  # Health check
  health_check:
    interval_seconds: 30
    include_gpu_stats: true

# -----------------------------------------------------------------------------
# Active Learning Integration
# -----------------------------------------------------------------------------
active_learning:
  enabled: false
  
  # Guardar muestras inciertas
  save_uncertain:
    enabled: false
    threshold: 0.3  # Guardar si confianza < threshold
    output_dir: "data/uncertain_samples"
    max_samples: 1000

# -----------------------------------------------------------------------------
# Documentación
# -----------------------------------------------------------------------------
docs:
  enabled: true
  title: "llarri-01 OCR API"
  description: "API de OCR especializada en escritura manuscrita"
  version: "1.0.0"
  
  # OpenAPI
  openapi_url: "/openapi.json"
  docs_url: "/docs"
  redoc_url: "/redoc"
