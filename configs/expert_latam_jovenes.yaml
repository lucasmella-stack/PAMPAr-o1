# =============================================================================
# EXPERTO: Latinoamérica - Letra de Jóvenes
# =============================================================================
# Configuración para fine-tuning de experto especializado en escritura
# manuscrita de jóvenes latinoamericanos.
#
# Características del dominio:
# - Letra más fluida y rápida
# - Uso de abreviaturas y anglicismos
# - Vocabulario informal/moderno
# - Menos énfasis en acentuación
# - Influencia de escritura digital

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DEL EXPERTO
# -----------------------------------------------------------------------------
expert:
  name: "expert_latam_jovenes"
  description: "Experto en escritura manuscrita de jóvenes latinoamericanos"
  version: "1.0.0"
  
  # Modelo base del que se deriva
  base_model: "outputs/experiment_xxx/checkpoints/final_model.ckpt"
  
  # Especialización
  specialization: "young_latam_handwriting"
  language: "es-419"  # Español latinoamericano
  age_group: "18-35"
  region: "latinoamerica"
  
  # Tipo de expert head
  # "lora" - Muy eficiente para este caso (recomendado)
  # "adapter" - Alternativa eficiente
  # "full" - Fine-tuning completo
  type: "lora"
  
  # Congelar encoder
  freeze_encoder: true
  
  # Parámetros específicos del tipo de expert
  params:
    # Para lora (recomendado para este experto)
    rank: 8
    alpha: 16.0
    target_modules: ["q_proj", "v_proj", "out_proj"]
    dropout: 0.05
    
    # Para adapter (descomentar si type=adapter)
    # adapter_size: 64
    # num_adapter_layers: 6
    
    # Para full (descomentar si type=full)
    # freeze_embeddings: true
    # freeze_n_layers: 3
  
  # Ruta a datos específicos del experto
  data_path: "data/splits/latam_jovenes"

# -----------------------------------------------------------------------------
# CARACTERÍSTICAS DEL DOMINIO
# -----------------------------------------------------------------------------
domain:
  # Características de la escritura
  handwriting_style:
    - "fast_writing"
    - "fluid_strokes"
    - "connected_letters"
    - "informal_style"
    - "abbreviations"
  
  # Vocabulario común
  common_vocabulary:
    - informal_spanish
    - anglicisms
    - slang
    - abbreviations
    - digital_influence
    - missing_accents  # Común en jóvenes
  
  # Regionalismos latinoamericanos
  regionalisms:
    - "vos_conjugation"  # Argentina, Uruguay
    - "weón"  # Chile
    - "chévere"  # Venezuela, Colombia
    - "padre"  # México
    - "bacán"  # Perú
  
  # Augmentations específicas para este dominio
  augmentations:
    # Menos augmentations extremos (letra más clara)
    rotation_degrees: 8
    gaussian_noise_std: 0.03
    affine_shear: 8
    
    # Simular escritura rápida
    motion_blur_probability: 0.2
    elastic_transform: 0.15

# -----------------------------------------------------------------------------
# ENTRENAMIENTO
# -----------------------------------------------------------------------------
training:
  # Hiperparámetros de entrenamiento
  epochs: 25
  batch_size: 12  # Puede usar batch más grande con LoRA
  learning_rate: 0.0002  # Slightly higher para LoRA
  
  # Early stopping
  patience: 7
  
  # Precisión
  precision: "16-mixed"
  
  # Gradient clipping
  gradient_clip_val: 1.0
  
  # Warm-up (útil para LoRA)
  warmup_steps: 100

# -----------------------------------------------------------------------------
# DATOS
# -----------------------------------------------------------------------------
data:
  # Fuentes de datos para este experto
  sources:
    - name: "custom_latam_jovenes"
      weight: 3.0  # Mayor peso para datos específicos
    - name: "iam_young"
      weight: 0.5
    - name: "synthetic_informal"
      weight: 1.0
  
  # Dimensiones de imagen
  img_height: 128
  img_width: 512
  
  # Longitud de secuencia (puede ser más corta por abreviaturas)
  max_length: 100
  
  # DataLoader
  num_workers: 4
  
  # Específico: vocabulario extendido con slang
  extended_vocabulary:
    - "xq"  # por qué
    - "tmb"  # también
    - "tbm"  # también (variante)
    - "q"   # que
    - "k"   # que (variante)
    - "pq"  # porque
    - "xfa" # por favor
    - "tq"  # te quiero
    - "salu2"  # saludos
    - "bn"  # bien
    - "ok"
    - "wow"
    - "jaja"
    - "jeje"

# -----------------------------------------------------------------------------
# EVALUACIÓN
# -----------------------------------------------------------------------------
evaluation:
  # Métricas específicas
  metrics:
    - "cer"  # Character Error Rate
    - "wer"  # Word Error Rate
    - "accuracy"
    - "informal_vocab_accuracy"  # Custom metric
  
  # Conjunto de validación
  val_split: 0.15
  
  # Ejemplos para monitoring
  monitor_examples: 15
  
  # Casos especiales a evaluar
  special_cases:
    - abbreviations
    - missing_accents
    - anglicisms
    - regionalisms

# -----------------------------------------------------------------------------
# POST-PROCESAMIENTO
# -----------------------------------------------------------------------------
postprocessing:
  # Correcciones automáticas específicas
  auto_corrections:
    # Expandir abreviaturas comunes
    expand_abbreviations: false  # Mantener estilo original
    
    # Añadir acentos faltantes
    add_missing_accents: false  # Respetar estilo juvenil
    
    # Normalizar regionalismos
    normalize_regionalisms: false

# -----------------------------------------------------------------------------
# NOTAS DE USO
# -----------------------------------------------------------------------------
# Para entrenar este experto:
#
# 1. Entrenar modelo base primero:
#    python -m llarri.training.train_base
#
# 2. Fine-tune el experto:
#    python -m llarri.training.finetune_expert \
#        --base-model outputs/experiment_xxx/checkpoints/final_model.ckpt \
#        --config configs/expert_latam_jovenes.yaml \
#        --expert-type lora
#
# 3. El experto se guardará en:
#    outputs/experts/expert_latam_jovenes/
#
# VENTAJAS DE LORA PARA ESTE CASO:
# - Solo ~0.5-1% de parámetros entrenables
# - Más rápido de entrenar
# - Fácil de combinar múltiples expertos
# - Requiere menos datos específicos

