[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pampar"
version = "1.0.0"
description = "PampaR — Cerebral Language Model with modular architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Lucas Ricardo Mella Chillemi", email = "lucas@segundacabeza.com" }
]
keywords = ["pytorch", "neural-networks", "language-model", "cerebral", "modular"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.0", "black>=23.3.0", "isort>=5.12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
