[tool.poetry]
name = "llarri-01"
version = "0.1.0"
description = "Handwritten text recognition project"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "llarri", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = "*"
torchvision = "*"
torchaudio = "*"
transformers = "*"
datasets = "*"
opencv-python = "*"
pytorch-lightning = "*"
onnx = "*"
onnxruntime = "*"
fastapi = "*"
uvicorn = "*"
python-multipart = "*"
pillow = "*"
scikit-learn = "*"
numpy = "*"
pandas = "*"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
mypy = "*"
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
