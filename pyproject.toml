[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llarri-o1"
version = "0.4.0"
description = "LLARRI-O1 — experimental fractal parameter-sharing architecture"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Lucas Ricardo Mella Chillemi", email = "lucas@segundacabeza.com" }
]
keywords = ["pytorch", "neural-networks", "fractal", "parameter-sharing", "mnist"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.0", "black>=23.3.0", "isort>=5.12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
