# =============================================================================
# docker-compose.yml - Orquestación de servicios llarri-01
# =============================================================================
# 
# Uso básico:
#   docker-compose up -d              # Iniciar todos los servicios
#   docker-compose logs -f api        # Ver logs de la API
#   docker-compose down               # Detener servicios
#
# Perfiles disponibles:
#   docker-compose --profile gpu up   # Con soporte GPU
#   docker-compose --profile dev up   # Modo desarrollo
#   docker-compose --profile full up  # Todos los servicios
#
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # API Principal - Servicio de OCR
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: llarri-api
    restart: unless-stopped
    
    ports:
      - "${API_PORT:-8000}:8000"
    
    volumes:
      # Modelos entrenados
      - ${MODEL_PATH:-../models}:/app/models:ro
      # Configuraciones (opcional override)
      - ${CONFIG_PATH:-../configs}:/app/configs:ro
      # Logs
      - llarri-logs:/app/logs
    
    environment:
      - PYTHONPATH=/app/src
      - LLARRI_CONFIG_PATH=/app/configs/api.yaml
      - MODEL_PATH=/app/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Configuración de workers
      - WORKERS=${API_WORKERS:-1}
      # Cache de modelos HuggingFace
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8000/health'); exit(0 if r.ok else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - llarri-network
    
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # API con GPU (perfil: gpu)
  # ---------------------------------------------------------------------------
  api-gpu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api.gpu
    container_name: llarri-api-gpu
    profiles:
      - gpu
    restart: unless-stopped
    
    ports:
      - "${API_PORT:-8000}:8000"
    
    volumes:
      - ${MODEL_PATH:-../models}:/app/models:ro
      - ${CONFIG_PATH:-../configs}:/app/configs:ro
      - llarri-logs:/app/logs
    
    environment:
      - PYTHONPATH=/app/src
      - LLARRI_CONFIG_PATH=/app/configs/api.yaml
      - MODEL_PATH=/app/models
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICES:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Configuración GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    
    networks:
      - llarri-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (perfil: full)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: llarri-nginx
    profiles:
      - full
      - prod
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - api
    
    networks:
      - llarri-network

  # ---------------------------------------------------------------------------
  # Redis Cache (perfil: full)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: llarri-redis
    profiles:
      - full
      - cache
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    
    networks:
      - llarri-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Prometheus Metrics (perfil: monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: llarri-prometheus
    profiles:
      - monitoring
      - full
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    
    networks:
      - llarri-network

  # ---------------------------------------------------------------------------
  # Grafana Dashboard (perfil: monitoring)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: llarri-grafana
    profiles:
      - monitoring
      - full
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    
    depends_on:
      - prometheus
    
    networks:
      - llarri-network

# =============================================================================
# Redes
# =============================================================================
networks:
  llarri-network:
    driver: bridge
    name: llarri-network

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  llarri-logs:
    name: llarri-logs
  redis-data:
    name: llarri-redis-data
  prometheus-data:
    name: llarri-prometheus-data
  grafana-data:
    name: llarri-grafana-data
